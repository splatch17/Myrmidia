<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="titre desc">
  <title id="titre">Myrmidia</title>
  <desc id="desc">Le nom MYRMIDIA se detache en lettres dorees devant une lueur ambree, encadre de hautes tiges d'herbe silhouettees ; une fourmi minuscule se tient au premier plan, ecrasee par l'echelle du monde.</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#241631"/>
      <stop offset="22%"  stop-color="#5c2a2a"/>
      <stop offset="45%"  stop-color="#a8542f"/>
      <stop offset="65%"  stop-color="#e2a84f"/>
      <stop offset="80%"  stop-color="#f2c469"/>
      <stop offset="92%"  stop-color="#8a4a26"/>
      <stop offset="100%" stop-color="#33190f"/>
    </linearGradient>

    <radialGradient id="cornerGlowCool" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8a7ab0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a7ab0" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cornerGlowWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f2a24a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2a24a" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fdefc2" stop-opacity="0.9"/>
      <stop offset="45%"  stop-color="#f2c469" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f2c469" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrbWarm" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fbe6b0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e0a752" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowOrbCool" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d9c4ec" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#b79bd6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="bladeFrontFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1c0f08"/>
      <stop offset="55%"  stop-color="#3d2a12"/>
      <stop offset="80%"  stop-color="#8a5423"/>
      <stop offset="92%"  stop-color="#e0a752"/>
      <stop offset="100%" stop-color="#f8d488"/>
    </linearGradient>

    <linearGradient id="antFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#8a5628"/>
      <stop offset="35%"  stop-color="#4a2d15"/>
      <stop offset="100%" stop-color="#241408"/>
    </linearGradient>

    <linearGradient id="titleFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fbe6b0"/>
      <stop offset="45%"  stop-color="#ecb85c"/>
      <stop offset="100%" stop-color="#b5652f"/>
    </linearGradient>

    <radialGradient id="textPlate" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#150b06" stop-opacity="0.4"/>
      <stop offset="60%"  stop-color="#150b06" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#150b06" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignetteGrad" cx="50%" cy="52%" r="75%">
      <stop offset="0%"   stop-color="#000000" stop-opacity="0"/>
      <stop offset="80%"  stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>

    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blurHaze" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="blurText" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- ciel -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#skyGrad)"/>

  <!-- pop chromatique aux coins -->
  <ellipse cx="100" cy="30" rx="320" ry="260" fill="url(#cornerGlowCool)"/>
  <ellipse cx="1120" cy="20" rx="340" ry="260" fill="url(#cornerGlowWarm)"/>

  <!-- lueur centrale, derriere le nom -->
  <ellipse cx="600" cy="190" rx="520" ry="300" fill="url(#sunGlow)"/>

  <!-- poussiere lumineuse -->
  <g filter="url(#blurSoft)">
    <circle cx="70"   cy="240" r="14" fill="url(#glowOrbWarm)"/>
    <circle cx="150"  cy="80"  r="10" fill="url(#glowOrbCool)"/>
    <circle cx="330"  cy="60"  r="8"  fill="url(#glowOrbWarm)"/>
    <circle cx="980"  cy="70"  r="12" fill="url(#glowOrbCool)"/>
    <circle cx="1120" cy="230" r="16" fill="url(#glowOrbWarm)"/>
    <circle cx="1050" cy="300" r="9"  fill="url(#glowOrbWarm)"/>
    <circle cx="220"  cy="300" r="8"  fill="url(#glowOrbCool)"/>
    <circle cx="870"  cy="290" r="7"  fill="url(#glowOrbWarm)"/>
    <circle cx="500"  cy="40"  r="6"  fill="url(#glowOrbCool)"/>
    <circle cx="700"  cy="45"  r="7"  fill="url(#glowOrbWarm)"/>
  </g>

  <!-- herbe, plan arriere : voilee, tassee dans la brume -->
  <g fill="#5a4636" opacity="0.4" filter="url(#blurHaze)">
    <path d="M 40,352 C 34,302 63,202 75,152 C 71,232 74,322 80,352 Z"/>
    <path d="M 434,352 C 429,310 444,225 440,182 C 446,250 461,327 466,352 Z"/>
    <path d="M 742,352 C 737,305 762,210 772,162 C 769,238 773,324 778,352 Z"/>
    <path d="M 986,352 C 982,315 995,240 992,202 C 997,262 1010,330 1014,352 Z"/>
    <path d="M 1162,352 C 1157,307 1181,217 1190,172 C 1188,244 1193,325 1198,352 Z"/>
  </g>

  <!-- herbe, plan avant : silhouettes nettes, bord retro-eclaire -->
  <g fill="url(#bladeFrontFill)">
    <path d="M -46,352 C -54,277 -12,127 10,52 C 1,172 -2,307 6,352 Z"/>
    <path d="M 126,352 C 116,245 139,30 120,-78 C 139,94 184,288 194,352 Z"/>
    <path d="M 300,352 C 294,295 324,180 338,122 C 333,214 334,318 340,352 Z"/>
    <path d="M 878,352 C 871,290 889,165 880,102 C 890,202 915,315 922,352 Z"/>
    <path d="M 1008,352 C 998,252 1049,52 1075,-48 C 1064,112 1062,292 1072,352 Z"/>
    <path d="M 1126,352 C 1119,285 1138,150 1128,82 C 1139,190 1167,312 1174,352 Z"/>
    <path d="M 1192,352 C 1184,267 1227,97 1248,12 C 1240,148 1240,301 1248,352 Z"/>
    <path d="M 366,352 C 362,317 382,247 390,212 C 387,268 390,331 394,352 Z"/>
    <path d="M 805,352 C 800,312 813,232 808,192 C 814,256 830,328 835,352 Z"/>
  </g>

  <!-- plaque de contraste douce derriere le nom -->
  <ellipse cx="600" cy="205" rx="440" ry="150" fill="url(#textPlate)"/>

  <!-- nom du jeu -->
  <text x="600" y="186" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif"
        font-size="88" font-weight="800" letter-spacing="16" fill="#150b06" opacity="0.55"
        filter="url(#blurText)">MYRMIDIA</text>
  <text x="600" y="182" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif"
        font-size="88" font-weight="800" letter-spacing="16" fill="url(#titleFill)"
        stroke="#2a150a" stroke-width="1.5" stroke-opacity="0.55" paint-order="stroke">MYRMIDIA</text>

  <text x="600" y="228" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif"
        font-size="22" font-weight="600" letter-spacing="7" fill="#150b06" opacity="0.5"
        filter="url(#blurText)">A L'ECHELLE D'UNE FOURMI</text>
  <text x="600" y="225" text-anchor="middle" font-family="'Trebuchet MS','Segoe UI',Verdana,sans-serif"
        font-size="22" font-weight="600" letter-spacing="7" fill="#f6dfa8">A L'ECHELLE D'UNE FOURMI</text>

  <!-- fioriture -->
  <g stroke="#f2c469" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <line x1="470" y1="246" x2="560" y2="246"/>
    <line x1="640" y1="246" x2="730" y2="246"/>
  </g>
  <rect x="595" y="241" width="10" height="10" fill="#f2c469" opacity="0.6" transform="rotate(45 600 246)"/>

  <!-- piste de pheromone -->
  <g fill="#f2c469">
    <circle cx="440" cy="350" r="4"   opacity="0.5"/>
    <circle cx="398" cy="351" r="3"   opacity="0.4"/>
    <circle cx="356" cy="351" r="2.5" opacity="0.32"/>
    <circle cx="308" cy="352" r="2"   opacity="0.24"/>
    <circle cx="254" cy="352" r="1.6" opacity="0.16"/>
    <circle cx="196" cy="352" r="1.2" opacity="0.1"/>
  </g>

  <!-- ombre de la fourmi -->
  <ellipse cx="600" cy="352" rx="110" ry="16" fill="#20100a" opacity="0.4" filter="url(#blurSoft)"/>

  <!-- pattes, effilees en deux segments -->
  <g stroke="#2a170c" stroke-linecap="round" fill="none">
    <path d="M 578,296 Q 555,300 545,318" stroke-width="5"/>
    <path d="M 545,318 Q 530,335 508,352" stroke-width="3"/>
    <path d="M 568,308 Q 540,315 522,330" stroke-width="5"/>
    <path d="M 522,330 Q 505,343 480,352" stroke-width="3"/>
    <path d="M 562,318 Q 535,330 515,342" stroke-width="5"/>
    <path d="M 515,342 Q 495,350 470,352" stroke-width="3"/>

    <path d="M 622,296 Q 645,300 655,318" stroke-width="5"/>
    <path d="M 655,318 Q 670,335 692,352" stroke-width="3"/>
    <path d="M 632,308 Q 660,315 678,330" stroke-width="5"/>
    <path d="M 678,330 Q 695,343 720,352" stroke-width="3"/>
    <path d="M 638,318 Q 665,330 685,342" stroke-width="5"/>
    <path d="M 685,342 Q 705,350 730,352" stroke-width="3"/>
  </g>

  <!-- antennes, bulbe sensoriel -->
  <g stroke="#2a170c" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 594,252 Q 578,225 566,196"/>
    <path d="M 606,252 Q 622,225 634,196"/>
  </g>
  <circle cx="566" cy="196" r="2.5" fill="#f2c469"/>
  <circle cx="634" cy="196" r="2.5" fill="#f2c469"/>

  <!-- corps -->
  <g fill="url(#antFill)">
    <ellipse cx="600" cy="322" rx="32" ry="22"/>
    <ellipse cx="600" cy="288" rx="19" ry="17"/>
    <ellipse cx="600" cy="263" rx="13" ry="12"/>
  </g>

  <!-- reflet chitineux -->
  <ellipse cx="588" cy="310" rx="12" ry="6" fill="#fbe6b0" opacity="0.22" transform="rotate(-20 588 310)"/>
  <circle cx="608" cy="260" r="2.2" fill="#f6dfa8" opacity="0.9"/>

  <!-- vignette legere -->
  <rect x="0" y="0" width="1200" height="360" fill="url(#vignetteGrad)"/>
</svg>
