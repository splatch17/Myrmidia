<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Myrmidia</title>
  <!-- Cinzel: titles only (player/uiTheme.js). Georgia stands in if it cannot load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; height: 100%; background: #0b0a08; overflow: hidden; }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }
    #hud { position: fixed; left: 14px; bottom: 10px; color: #c9a86a; font: 600 11px/1.4 'Cinzel', Georgia, serif; letter-spacing: .08em; opacity: 0.55; pointer-events: none; text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">Myrmidia — prototype Three.js</div>
  <script type="module" src="/src/main.js"></script>
